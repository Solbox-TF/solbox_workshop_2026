<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>상품 안내 | 레크 게임</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="prizes.css" />
  </head>
  <body class="prize-page">
    <main class="prize-shell">
      <section class="prize-hero" aria-labelledby="prize-title">
        <div class="prize-hero__photo" aria-hidden="true"></div>
        <div class="prize-hero__copy">
          <p class="eyebrow">award board</p>
          <h1 id="prize-title">상품 안내</h1>
          <p class="prize-lead">수상자는 원하는 상품권을 고를 수 있습니다.</p>
          <div class="prize-actions" aria-label="페이지 이동">
            <a class="screen-link" href="index.html">
              <span aria-hidden="true">←</span>
              게임 선택
            </a>
            <a class="screen-link" href="score.html">
              <span aria-hidden="true">＋</span>
              점수 입력판
            </a>
          </div>
        </div>
      </section>

      <section class="voucher-stage" aria-labelledby="voucher-title">
        <div class="prize-section-heading">
          <p class="eyebrow">voucher choice</p>
          <h2 id="voucher-title">선택 가능한 상품권</h2>
        </div>
        <div class="voucher-grid">
          <article class="voucher-card voucher-card--mint">
            <span class="voucher-card__mark">B</span>
            <strong>배민</strong>
          </article>
          <article class="voucher-card voucher-card--gold">
            <span class="voucher-card__mark">S</span>
            <strong>신세계</strong>
          </article>
          <article class="voucher-card voucher-card--red">
            <span class="voucher-card__mark">C</span>
            <strong>쿠팡</strong>
          </article>
          <article class="voucher-card voucher-card--green">
            <span class="voucher-card__mark">O</span>
            <strong>올리브영</strong>
          </article>
          <article class="voucher-card voucher-card--coffee">
            <span class="voucher-card__mark">★</span>
            <strong>스타벅스</strong>
          </article>
        </div>
      </section>

      <section class="award-board" aria-labelledby="award-title">
        <div class="prize-section-heading">
          <p class="eyebrow">prize line-up</p>
          <h2 id="award-title">시상 내역</h2>
        </div>

        <div class="award-list">
          <article class="award-card award-card--first">
            <div class="award-card__rank">1등</div>
            <div>
              <h3>상품권 12만원</h3>
              <p>3만원씩 지급</p>
            </div>
            <strong>120,000원</strong>
          </article>

          <article class="award-card">
            <div class="award-card__rank">2등</div>
            <div>
              <h3>상품권 4만원</h3>
              <p>1만원씩 지급</p>
            </div>
            <strong>40,000원</strong>
          </article>

          <article class="award-card">
            <div class="award-card__rank">3등</div>
            <div>
              <h3>상품권 2만원</h3>
              <p>5천원씩 지급</p>
            </div>
            <strong>20,000원</strong>
          </article>

          <article class="award-card award-card--special">
            <div class="award-card__rank">특별상</div>
            <div>
              <h3>웃음상 / 열정상</h3>
              <p>2명에게 1만원씩 지급</p>
            </div>
            <strong>20,000원</strong>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
